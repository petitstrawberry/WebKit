<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/share/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>serif</family><prefer><family>M PLUS 1</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>M PLUS 1</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font Mono</family></prefer></alias>
</fontconfig>
